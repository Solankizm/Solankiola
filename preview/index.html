<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Solankizm — dashboard preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{ --bg:#050607; --panel:#0E1113; --line:#1C2125; --txt:#F4F6F7; --dim:#7D878E; --accent:#3B9CFF; }
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"Inter",Segoe UI,Roboto,sans-serif}
  body{background:#000;display:grid;place-items:center;min-height:100vh;color:var(--txt)}
  .frame{width:960px;height:540px;background:var(--bg);border-radius:20px;overflow:hidden;display:flex;box-shadow:0 0 0 8px #111,0 24px 60px #0008}
  .rail{width:70px;background:var(--panel);display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 0}
  .rail .dot{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--dim);font-size:18px}
  .rail .dot.on{background:rgba(59,156,255,.14);color:var(--accent)}
  .main{flex:1;display:flex;padding:20px;gap:14px}
  .bat{width:60px;display:flex;flex-direction:column;align-items:center}
  .bat b{font-size:20px}.bat small{color:var(--dim);font-size:9px;letter-spacing:1.5px}
  .leds{margin-top:12px;width:26px;height:210px;display:flex;flex-direction:column-reverse;gap:4px}
  .leds i{flex:1;border-radius:4px;background:var(--line)}
  .leds i.f{background:var(--accent)}
  .centre{flex:1.6;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .island{background:var(--panel);border-radius:50px;padding:8px 16px;display:flex;gap:12px;align-items:center;font-size:13px;color:var(--accent);font-weight:600}
  .ring{position:relative;width:300px;height:300px;margin-top:6px}
  .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .num b{font-size:96px;font-weight:800;line-height:.9}
  .num span{color:var(--dim);font-size:15px}
  .pill{margin-top:10px;border:1px solid rgba(59,156,255,.5);background:rgba(59,156,255,.14);color:var(--accent);border-radius:50px;padding:6px 18px;font-weight:700;letter-spacing:2px;font-size:13px}
  .stats{flex:1;display:flex;flex-direction:column;gap:12px;justify-content:center}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
  .card small{color:var(--dim);font-size:10px;letter-spacing:1.5px}
  .card b{font-size:26px}.card em{color:var(--accent);font-style:normal;font-size:13px;font-weight:600}
  .cap{margin-top:14px;color:#555;font-size:12px;text-align:center}
</style>
</head>
<body>
  <div>
    <div class="frame">
      <div class="rail">
        <div class="dot on">◎</div><div class="dot">↤</div>
        <div class="dot">⚡</div><div class="dot">↗</div><div class="dot">⚙</div>
      </div>
      <div class="main">
        <div class="bat">
          <b>72%</b><small>BATTERY</small>
          <div class="leds">
            <i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i>
            <i class="f"></i><i class="f"></i><i></i><i></i><i></i>
          </div>
        </div>
        <div class="centre">
          <div class="island">◀ &nbsp; D &nbsp; 72% &nbsp; ▶</div>
          <div class="ring">
            <svg viewBox="0 0 300 300" width="300" height="300">
              <circle cx="150" cy="150" r="130" fill="none" stroke="#1C2125" stroke-width="18"
                      stroke-dasharray="612 816" stroke-dashoffset="-102" stroke-linecap="round"
                      transform="rotate(135 150 150)"/>
              <circle cx="150" cy="150" r="130" fill="none" stroke="#3B9CFF" stroke-width="18"
                      stroke-dasharray="420 1000" stroke-dashoffset="-102" stroke-linecap="round"
                      transform="rotate(135 150 150)"/>
            </svg>
            <div class="num"><b>58</b><span>km/h</span></div>
          </div>
          <div class="pill">● NORMAL · DEMO</div>
        </div>
        <div class="stats">
          <div class="card"><small>RANGE</small><br><b>96</b> <em>km</em></div>
          <div class="card"><small>TRIP</small><br><b>12.4</b> <em>km</em></div>
          <div class="card"><small>ODOMETER</small><br><b>4135</b> <em>km</em></div>
          <div class="card"><small>MOTOR</small><br><b>46</b> <em>°C</em></div>
        </div>
      </div>
    </div>
    <p class="cap">Static mockup of the Solankizm dashboard. The real app (Kotlin/Compose) animates the speed arc and switches accent colour by ride mode.</p>
  </div>
</body>
</html>
